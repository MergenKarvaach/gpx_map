    <script>
    function centerMap(e) {
        e.preventDefault();

        var map = map_ee50690b768f2f2f6dc217e3bd403984;
        map.setView([37.835191577570924, 32.52340130927259], 14);

    <script>

    setTimeout(() => {

        var map = map_ee50690b768f2f2f6dc217e3bd403984;

        let geoLayer = null;

        // find ONLY GeoJSON layer
        map.eachLayer(function(layer) {
            if (layer instanceof L.GeoJSON) {
                geoLayer = layer;
            }
        });

        if (!geoLayer) return;

        let trips = new Set();

        geoLayer.eachLayer(function(l) {
            let t = l.feature?.properties?.trips || [];
            t.forEach(x => trips.add(x));
        });

        let control = L.control({position: 'topright'});
        control.onAdd = function() {
            let div = L.DomUtil.create('div', '');
            div.innerHTML = `
                <select id="tripSelect" style="padding:6px;">
                    <option value="ALL">ALL</option>
                </select>
            `;
            return div;
        };
        control.addTo(map);

        let select = document.getElementById("tripSelect");

        Array.from(trips).sort().forEach(t => {
            let opt = document.createElement("option");
            opt.value = t;
            opt.text = t;
            select.appendChild(opt);
        });

        function applyFilter(value) {
            geoLayer.eachLayer(function(l) {

                let t = l.feature?.properties?.trips || [];

                if (value === "ALL" || t.includes(value)) {
                    l.addTo(map);
                } else {
                    map.removeLayer(l);
                }
            });
        }

        select.addEventListener("change", function(e) {
            applyFilter(e.target.value);
        });

    }, 1200);

    </script>

    geo_json_div_1.bindTooltip(
    function(layer){
    let div = L.DomUtil.create('div');
    
    let handleObject = feature => {
        if (feature === null) {
            return '';
        } else if (typeof(feature)=='object') {
            return JSON.stringify(feature);
        } else {
            return feature;
        }
    }
    let fields = ["source", "hex", "first_seen", "last_seen", "visits"];
    let aliases = ["Trips:", "Hex:", "First seen:", "Last seen:", "Visits:"];
    let table = '<table>' +
        String(
        fields.map(
        (v,i)=>
        `<tr>
            <th>${aliases[i]}</th>
            
            <td>${handleObject(layer.feature.properties[v])}</td>
        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }
    ,{
  "sticky": true,
  "className": "foliumtooltip",
});
